version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
    datefmt: "%Y-%m-%dT%H:%M:%S"
  detailed:
    format: "%(asctime)s [%(levelname)s] %(name)s (%(filename)s:%(lineno)d): %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout

  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: logs/trading_bot.log
    maxBytes: 52428800  # 50 MB
    backupCount: 5
    encoding: utf8

loggers:
  trading_bot:
    level: DEBUG
    handlers: [console, file]
    propagate: false

  exchange:
    level: DEBUG
    handlers: [console, file]
    propagate: false

  strategy:
    level: DEBUG
    handlers: [console, file]
    propagate: false

  risk:
    level: WARNING
    handlers: [console, file]
    propagate: false

  core:
    level: INFO
    handlers: [console, file]
    propagate: false

  app:
    level: INFO
    handlers: [console, file]
    propagate: false

  paper:
    level: INFO
    handlers: [console, file]
    propagate: false

  execution:
    level: INFO
    handlers: [console, file]
    propagate: false

  bridge:
    level: INFO
    handlers: [console, file]
    propagate: false

  strategies:
    level: INFO
    handlers: [console, file]
    propagate: false

root:
  level: INFO
  handlers: [console, file]
